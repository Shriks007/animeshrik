name: Build AnimeShrik Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Tauri + Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          else
            NDK_DIR=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 -type d | head -n 1)
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm approve-builds --all

      - name: Build Frontend for Tauri
        run: |
          export TAURI_BUILD=1
          export TAURI_ENV_PLATFORM=android
          pnpm run build

      - name: Build Android APK with Tauri CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUILD: 1
          TAURI_ENV_PLATFORM: android
        run: |
          pnpm tauri android init
          pnpm tauri icon src-tauri/icons/icon.png
          python3 -c "
          path = 'src-tauri/gen/android/app/src/main/AndroidManifest.xml'
          with open(path, 'r') as f:
              content = f.read()
          deep_link_filter = '''
                <intent-filter>
                  <action android:name=\"android.intent.action.VIEW\" />
                  <category android:name=\"android.intent.category.DEFAULT\" />
                  <category android:name=\"android.intent.category.BROWSABLE\" />
                  <data android:scheme=\"animeshrik\" />
                </intent-filter>
          '''
          if 'android:scheme=\"animeshrik\"' not in content:
              content = content.replace('</activity>', deep_link_filter + '\n    </activity>')
              with open(path, 'w') as f:
                  f.write(content)
          print('Injected animeshrik scheme intent-filter into AndroidManifest.xml')

          import glob
          main_activities = glob.glob('src-tauri/gen/android/**/MainActivity.kt', recursive=True)
          if main_activities:
              kt_path = main_activities[0]
              print('Found MainActivity at', kt_path)
              with open(kt_path, 'r') as f:
                  orig = f.read()
              pkg_line = [l for l in orig.splitlines() if l.startswith('package ')][0] if 'package ' in orig else 'package com.animeshrik.app'
              kt_code = f'''{pkg_line}

import android.os.Bundle
import android.webkit.WebView
import android.webkit.WebViewClient
import android.webkit.WebResourceRequest

class MainActivity : app.tauri.TauriActivity() {{
  override fun onWebViewCreate(webView: WebView) {{
    super.onWebViewCreate(webView)
    webView.webViewClient = object : WebViewClient() {{
      override fun shouldOverrideUrlLoading(view: WebView?, request: WebResourceRequest?): Boolean {{
        val url = request?.url?.toString() ?: return false
        return handleUrl(view, url)
      }}
      @Deprecated("Deprecated in Java")
      override fun shouldOverrideUrlLoading(view: WebView?, url: String?): Boolean {{
        if (url == null) return false
        return handleUrl(view, url)
      }}
      private fun handleUrl(view: WebView?, url: String): Boolean {{
        if (url.startsWith("animeshrik://")) {{
          val pathAndQuery = url.removePrefix("animeshrik://").removePrefix("/")
          view?.loadUrl("http://tauri.localhost/" + pathAndQuery)
          return true
        }}
        return false
      }}
    }}
  }}
}}
'''
              with open(kt_path, 'w') as f:
                  f.write(kt_code)
              print('Successfully patched MainActivity.kt with custom scheme interceptor!')
          "
          pnpm tauri android build --apk --debug --target aarch64

      - name: Locate Generated APKs
        if: always()
        run: |
          mkdir -p output-apks
          find src-tauri -name "*.apk" -exec cp {} output-apks/ \; 2>&1 || true
          find target -name "*.apk" -exec cp {} output-apks/ \; 2>&1 || true
          FIRST_APK=$(find output-apks -name "*.apk" | head -n 1)
          if [ -n "$FIRST_APK" ]; then
            cp "$FIRST_APK" output-apks/AnimeShrik.apk
          fi
          ls -la output-apks/ || true

      - name: Upload AnimeShrik APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShrik-Android-APK
          path: output-apks/*.apk
          retention-days: 14
