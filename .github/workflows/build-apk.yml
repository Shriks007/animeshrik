name: Build AnimeShrik Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Tauri + Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          else
            NDK_DIR=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 -type d | head -n 1)
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm approve-builds --all

      - name: Build Frontend for Tauri
        run: |
          export TAURI_BUILD=1
          export TAURI_ENV_PLATFORM=android
          pnpm run build

      - name: Ensure Permanent Keystore
        run: |
          if [ ! -f src-tauri/release.keystore ]; then
            echo "Generating permanent release keystore..."
            keytool -genkeypair -v -keystore src-tauri/release.keystore -alias animeshrik -keyalg RSA -keysize 2048 -validity 10000 -storepass animeshrik123 -keypass animeshrik123 -dname "CN=AnimeShrik, OU=App, O=AnimeShrik, L=Tokyo, ST=Tokyo, C=JP"
          fi

      - name: Build Android APK with Tauri CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUILD: 1
          TAURI_ENV_PLATFORM: android
        run: |
          pnpm tauri android init
          pnpm tauri icon src-tauri/icons/icon.png
          python3 scripts/patch-android.py
          pnpm tauri android build --apk --debug --target aarch64

      - name: Locate Generated APKs
        if: always()
        run: |
          mkdir -p output-apks
          find src-tauri -name "*.apk" -exec cp {} output-apks/ \; 2>&1 || true
          find target -name "*.apk" -exec cp {} output-apks/ \; 2>&1 || true
          FIRST_APK=$(find output-apks -name "*.apk" | head -n 1)
          if [ -n "$FIRST_APK" ]; then
            cp "$FIRST_APK" output-apks/AnimeShrik.apk
          fi
          ls -la output-apks/ || true

      - name: Upload AnimeShrik APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShrik-Android-APK
          path: output-apks/*.apk
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: success() && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        with:
          tag_name: v2.0.3
          name: "AnimeShrik v2.0.3"
          body: |
            ### AnimeShrik v2.0.3 Release

            - **Permanent Release Signing**: Configured dedicated release signing key in Gradle so that all future APK updates install seamlessly over previous versions without uninstalling.
            - **Bottom Sheet Z-Index Fix**: Fixed episode range and display sheets overlapping beneath the bottom navigation bar.
            - **Smart Episode Range Selection**: Episode lists now automatically jump to your current or highest-watched episode instead of defaulting to 1–100.
            - **Upcoming Episode Detection**: Future/unreleased episodes are styled as "Airing Soon", prevented from false watched ticks, and guarded against dead server loads.
            - **Latest Episodes Row**: Added dedicated "Latest Episodes" row on the Home page showing recently aired episodes with episode numbers.
            - **Discussion Quick Browser Access**: Added 1-tap "Open in Browser" button and login guidance for community discussions and Google login.
            - **Notification Count Badge**: Connected unread notification badge with real-time airing schedules and watchlist sync.
          files: |
            output-apks/AnimeShrik.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

