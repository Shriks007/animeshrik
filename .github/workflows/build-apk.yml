name: Build AnimeShrik Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK (Tauri + Rust)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK and NDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          if [ -d "$ANDROID_HOME/ndk/26.1.10909125" ]; then
            NDK_DIR="$ANDROID_HOME/ndk/26.1.10909125"
          else
            NDK_DIR=$(find $ANDROID_HOME/ndk -maxdepth 1 -mindepth 1 -type d | head -n 1)
          fi
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Frontend Dependencies
        run: |
          pnpm install --no-frozen-lockfile
          pnpm approve-builds --all

      - name: Build Frontend for Tauri
        run: |
          export TAURI_BUILD=1
          export TAURI_ENV_PLATFORM=android
          pnpm run build

      - name: Build Android APK with Tauri CLI
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_BUILD: 1
          TAURI_ENV_PLATFORM: android
        run: |
          pnpm tauri android init
          pnpm tauri icon src-tauri/icons/icon.png
          python3 scripts/patch-android.py
          pnpm tauri android build --apk --debug --target aarch64

      - name: Locate Generated APKs
        if: always()
        run: |
          mkdir -p output-apks
          find src-tauri -name "*.apk" -exec cp {} output-apks/ \; 2>&1 || true
          find target -name "*.apk" -exec cp {} output-apks/ \; 2>&1 || true
          FIRST_APK=$(find output-apks -name "*.apk" | head -n 1)
          if [ -n "$FIRST_APK" ]; then
            cp "$FIRST_APK" output-apks/AnimeShrik.apk
          fi
          ls -la output-apks/ || true

      - name: Upload AnimeShrik APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnimeShrik-Android-APK
          path: output-apks/*.apk
          retention-days: 14
